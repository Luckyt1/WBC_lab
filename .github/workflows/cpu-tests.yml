name: CPU tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install torch==2.7.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements/cpu-tests.txt
      - run: python tools/build_arm_ruckig.py
      - run: python -m pytest -q -p no:cacheprovider tests
      - run: ./deploy.sh train --output logs/example --dry-run
      - run: ./deploy.sh pack --output dist/WBC_lab_source.tar.gz
